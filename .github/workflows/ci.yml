name: CI Acorde 2.0

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: acorde_test
          POSTGRES_USER: acorde_test
          POSTGRES_PASSWORD: acorde_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acorde_test -d acorde_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ACORDE_TEST_DB_URL: jdbc:postgresql://localhost:5432/acorde_test
      ACORDE_TEST_DB_USERNAME: acorde_test
      ACORDE_TEST_DB_PASSWORD: acorde_test
      ACORDE_TEST_DDL_AUTO: none
      ACORDE_TEST_FLYWAY_ENABLED: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run lint && npm run build
        working-directory: frontend

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: mobile
