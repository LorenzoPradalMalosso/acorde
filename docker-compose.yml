services:
  postgres:
    image: postgres:17-alpine
    container_name: acorde-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acorde}
      POSTGRES_USER: ${POSTGRES_USER:-acorde}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acorde_local}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - acorde-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acorde} -d ${POSTGRES_DB:-acorde}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  acorde-postgres-data:
