<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="t d">
  <title id="t">Acorde 2.0 — módulos de expansão de carbono</title>
  <desc id="d">Atividades emissoras podem ganhar detalhes futuros de frota, viagens corporativas e materiais/resíduos; fatores versionados alimentam registros históricos. Metas se ligam a ações, alertas e relatórios.</desc>
  <defs><style>.bg{fill:#F7FAF8}.box{fill:#fff;stroke:#1F6B58;stroke-width:2;rx:12}.head{fill:#0F3D34;rx:12}.h{font:700 17px Inter,Arial,sans-serif;fill:#fff}.f{font:14px Inter,Arial,sans-serif;fill:#1F2A28}.title{font:700 27px Manrope,Inter,Arial,sans-serif;fill:#0F3D34}.sub{font:15px Inter,Arial,sans-serif;fill:#66746D}.edge{fill:none;stroke:#1F6B58;stroke-width:3;marker-end:url(#a)}.label{font:13px Inter,Arial,sans-serif;fill:#1F6B58}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1F6B58"/></marker></defs>
  <rect class="bg" width="1400" height="900"/><text class="title" x="55" y="55">Acorde 2.0 · módulos de expansão</text><text class="sub" x="55" y="83">Propostas fora do MVP; fontes e métodos precisam de validação antes da implementação</text>
  <path class="edge" d="M320 300 C390 300 410 300 480 300"/><path class="edge" d="M770 300 C820 300 830 300 880 300"/><path class="edge" d="M1035 215 L1035 245"/><path class="edge" d="M1030 405 C1030 490 1060 520 1080 590"/><path class="edge" d="M320 680 C360 680 390 680 430 680"/><path class="edge" d="M700 680 C800 680 850 680 950 680"/>
  <g transform="translate(70 230)"><rect class="box" width="250" height="145"/><rect class="head" width="250" height="40"/><text class="h" x="14" y="27">ATIVIDADE EMISSORA</text><text class="f" x="14" y="70">Organização · membro</text><text class="f" x="14" y="98">Categoria · período · estado</text><text class="f" x="14" y="126">Registro genérico versionado</text></g>
  <g transform="translate(480 230)"><rect class="box" width="290" height="145"/><rect class="head" width="290" height="40"/><text class="h" x="14" y="27">DETALHE DA FONTE</text><text class="f" x="14" y="70">MVP: energia / deslocamento</text><text class="f" x="14" y="98">Futuro: frota / viagens</text><text class="f" x="14" y="126">Materiais / resíduos</text></g>
  <g transform="translate(900 90)"><rect class="box" width="270" height="125"/><rect class="head" width="270" height="40"/><text class="h" x="14" y="27">FATORES VERSIONADOS</text><text class="f" x="14" y="72">Fonte · unidade · validade</text><text class="f" x="14" y="101">Região · escopo · premissas</text></g>
  <g transform="translate(880 245)"><rect class="box" width="300" height="160"/><rect class="head" width="300" height="40"/><text class="h" x="14" y="27">REGISTROS DE EMISSÃO</text><text class="f" x="14" y="72">Quantidade/fator utilizados</text><text class="f" x="14" y="101">Resultado · estado · vigência</text><text class="f" x="14" y="130">Histórico sem dupla contagem</text></g>
  <g transform="translate(70 610)"><rect class="box" width="250" height="145"/><rect class="head" width="250" height="40"/><text class="h" x="14" y="27">META DE CARBONO</text><text class="f" x="14" y="70">Período-base comparável</text><text class="f" x="14" y="98">Alvo · prazo · estado</text><text class="f" x="14" y="126">Organização</text></g>
  <g transform="translate(430 610)"><rect class="box" width="270" height="145"/><rect class="head" width="270" height="40"/><text class="h" x="14" y="27">AÇÃO DE REDUÇÃO</text><text class="f" x="14" y="70">Responsável · prazo · estado</text><text class="f" x="14" y="98">Progresso operacional</text><text class="f" x="14" y="126">Não equivale a emissão evitada</text></g>
  <g transform="translate(950 590)"><rect class="box" width="300" height="145"/><rect class="head" width="300" height="40"/><text class="h" x="14" y="27">RELATÓRIOS / ALERTAS</text><text class="f" x="14" y="70">Expansões futuras</text><text class="f" x="14" y="98">Cobertura e método visíveis</text><text class="f" x="14" y="126">Totais derivados dos registros</text></g>
  <text class="sub" x="55" y="830">Não somar revisões substituídas; não chamar fontes parciais de inventário completo.</text>
