<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Acorde 2.0 — modelo conceitual do MVP</title>
  <desc id="desc">Organizações e membros registram atividades de energia ou deslocamento, calculadas com fatores de emissão versionados. Metas possuem ações de redução atribuídas a membros.</desc>
  <defs>
    <style>
      .bg{fill:#F7FAF8}.card{fill:#fff;stroke:#1F6B58;stroke-width:2;rx:14}.head{fill:#0F3D34;rx:14}.title{font:700 28px Manrope,Inter,sans-serif;fill:#0F3D34}.subtitle{font:16px Inter,sans-serif;fill:#66746D}.entity{font:700 16px Inter,sans-serif;fill:#fff}.field{font:14px Inter,sans-serif;fill:#1F2A28}.rel{stroke:#1F6B58;stroke-width:3;fill:none;marker-end:url(#arrow)}.tag{font:13px Inter,sans-serif;fill:#1F6B58}.note{font:14px Inter,sans-serif;fill:#66746D}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1F6B58"/></marker>
  </defs>
  <rect class="bg" width="1600" height="1080"/>
  <text class="title" x="60" y="58">Acorde 2.0 · DER conceitual do MVP</text>
  <text class="subtitle" x="60" y="88">Fontes monitoradas: energia elétrica e deslocamento casa–trabalho · cálculo histórico em kg CO₂e</text>
  <!-- Relations behind entity cards -->
  <path class="rel" d="M300 218 C350 218 365 300 420 300"/><text class="tag" x="330" y="238">1:N</text>
  <path class="rel" d="M300 470 C355 470 365 350 420 350"/><text class="tag" x="340" y="434">1:N</text>
  <path class="rel" d="M690 300 C745 300 750 205 810 205"/><text class="tag" x="735" y="250">1:0..1</text>
  <path class="rel" d="M690 350 C745 350 750 440 810 440"/><text class="tag" x="735" y="393">1:0..1</text>
  <path class="rel" d="M690 335 C840 335 900 315 1040 315"/><text class="tag" x="835" y="322">1:N revisões</text>
  <path class="rel" d="M1010 635 C1050 560 1080 460 1110 405"/><text class="tag" x="1032" y="522">1:N</text>
  <path class="rel" d="M690 775 C850 775 930 790 1110 790"/><text class="tag" x="880" y="764">1:N</text>
  <path class="rel" d="M300 470 C600 600 800 720 1110 790"/><text class="tag" x="650" y="630">responsável</text>
  <!-- organization -->
  <g transform="translate(60 145)"><rect class="card" width="240" height="145"/><rect class="head" width="240" height="42"/><text class="entity" x="16" y="27">ORGANIZACOES</text><text class="field" x="16" y="70">id · UUID PK</text><text class="field" x="16" y="96">nome</text><text class="field" x="16" y="122">criado_em</text></g>
  <!-- users and members -->
  <g transform="translate(60 395)"><rect class="card" width="240" height="180"/><rect class="head" width="240" height="42"/><text class="entity" x="16" y="27">USUARIOS / MEMBROS</text><text class="field" x="16" y="70">usuario: email, senha_hash</text><text class="field" x="16" y="98">membro: organizacao_id FK</text><text class="field" x="16" y="126">usuario_id FK · papel</text><text class="field" x="16" y="154">UNIQUE(org, usuario)</text></g>
  <!-- activities -->
  <g transform="translate(420 245)"><rect class="card" width="270" height="220"/><rect class="head" width="270" height="42"/><text class="entity" x="16" y="27">ATIVIDADES_EMISSORAS</text><text class="field" x="16" y="72">organizacao_id · membro_id</text><text class="field" x="16" y="102">categoria · período</text><text class="field" x="16" y="132">quantidade · unidade</text><text class="field" x="16" y="162">estado · criado_em</text><text class="field" x="16" y="192">energia ou mobilidade</text></g>
  <!-- details -->
  <g transform="translate(810 130)"><rect class="card" width="260" height="150"/><rect class="head" width="260" height="42"/><text class="entity" x="16" y="27">DADOS_ENERGIA</text><text class="field" x="16" y="76">atividade_id PK/FK</text><text class="field" x="16" y="106">consumo_kwh</text><text class="field" x="16" y="136">região/rede aplicável</text></g>
  <g transform="translate(810 365)"><rect class="card" width="260" height="165"/><rect class="head" width="260" height="42"/><text class="entity" x="16" y="27">DADOS_DESLOCAMENTO</text><text class="field" x="16" y="76">atividade_id PK/FK</text><text class="field" x="16" y="106">modalidade · distância</text><text class="field" x="16" y="136">dias/viagens · ocupação*</text><text class="field" x="16" y="156">*quando pertinente</text></g>
  <!-- factor -->
  <g transform="translate(810 580)"><rect class="card" width="260" height="180"/><rect class="head" width="260" height="42"/><text class="entity" x="16" y="27">FATORES_EMISSAO</text><text class="field" x="16" y="76">categoria · escopo · valor</text><text class="field" x="16" y="106">unidades · região · validade</text><text class="field" x="16" y="136">fonte · versão · premissas</text><text class="field" x="16" y="166">versões históricas imutáveis</text></g>
  <!-- emission record -->
  <g transform="translate(1110 235)"><rect class="card" width="300" height="200"/><rect class="head" width="300" height="42"/><text class="entity" x="16" y="27">REGISTROS_EMISSAO</text><text class="field" x="16" y="76">atividade_id · fator_id</text><text class="field" x="16" y="106">quantidade/fator aplicados</text><text class="field" x="16" y="136">resultado_kg_co2e · estado</text><text class="field" x="16" y="166">vigente · calculado_em</text><text class="field" x="16" y="192">pendente sem zero artificial</text></g>
  <!-- goal and action -->
  <g transform="translate(420 690)"><rect class="card" width="270" height="175"/><rect class="head" width="270" height="42"/><text class="entity" x="16" y="27">METAS_CARBONO</text><text class="field" x="16" y="76">organização · categoria</text><text class="field" x="16" y="106">período e valor-base</text><text class="field" x="16" y="136">redução-alvo · prazo · estado</text><text class="field" x="16" y="162">base comparável necessária</text></g>
  <g transform="translate(1110 730)"><rect class="card" width="260" height="150"/><rect class="head" width="260" height="42"/><text class="entity" x="16" y="27">ACOES_REDUCAO</text><text class="field" x="16" y="76">meta_id · responsável</text><text class="field" x="16" y="106">título · descrição · prazo</text><text class="field" x="16" y="136">estado operacional separado</text></g>
  <text class="note" x="60" y="970">Modelo proposto, não implementado. Totais agregam somente registros válidos vigentes e devem informar cobertura parcial.</text>
  <text class="note" x="60" y="1000">Fatores reais, metodologia, RBAC, estados e constraints ainda requerem validação antes das migrações.</text>
</svg>
